<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Doctor's Visit Form</title>
    </head>
    <body>
        <h1>Doctor's Visit Form</h1>
        <form action="submit form.html" method="post">
          <label for="name">Name:</label>
          <input type="text" name="name" id="name" required>

          <br><br>
          <label for="age">Age:</label>
          <input type="number" name="age" id="age" required>

          <br><br>
          <label for="gender">Gender:</label>
          <input type="radio" id="male" name="gender" value="Male">
          <label for="male">Male</label>
          <input type="radio" id="female" name="gender" value="Female">
          <label for="female">Female</label>

            <br><br>
          <input type ="checkbox" id="visit1" name="visit1" value="Visit 1">
          <label for="visit1">First Visit</label>   
          <input type ="checkbox" id="visit2" name="visit2" value="Visit 2">
          <label for="visit2">Follow-up </label>
          <input type ="checkbox" id="visit3" name="visit3" value="Visit 3">
          <label for="visit3">Check up</label>

            <br>    
          <label for="email">Email:</label>
          <input type="email" name="email" id="email" required>

            <br><br>
          <label for="phone">Phone:</label> 
          <input type="tel" name="phone" id="phone" required>

            <br><br>
            <label for="symptoms">Symptoms:</label>
            <br>
            <textarea name="symptoms" id="symptoms" rows="4" cols="50" required></textarea>
            <br><br>    
        <p>Appointment Details</p>
        <label for="date">Date:</label>
        <input type="date" name="date" id="date" required>

        <label for="time">Time:</label>
        <input type="time" name="time" id="time" required>
         <p> Reason of visit:</p>
         <textarea name="reason" id="reason" rows="4" cols="50" required></textarea>
        <br><br>    

        <input type="submit" value="Submit">
        
        </form>
    </body>
</html>
